allprojects {
    group = 'com.aresstack'
    version = (findProperty('releaseVersion') ?: '0.1.0-SNAPSHOT').toString()
    repositories {
        mavenCentral()
        // Resolve unreleased Serp4j artifacts only from the local Maven repository.
        mavenLocal {
            content { includeModuleByRegex('com\\.aresstack', 'serp4j-.*') }
        }
    }
}

ext.gsonVersion = '2.14.0'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
        withSourcesJar()
        withJavadocJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    publishing {
        publications {
            library(MavenPublication) {
                from components.java
                artifactId = "research4j-${project.name}"
                pom {
                    name = "Research4j - ${project.name}"
                    description = 'Reusable browser-based research components'
                    url = 'https://github.com/aresstack/research4j'
                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/aresstack/research4j.git'
                        url = 'https://github.com/aresstack/research4j'
                    }
                }
            }
        }
    }
}
